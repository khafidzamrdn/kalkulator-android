<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <title>Kalkulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <div class="calculator">
            <!-- Header dengan toggle tema -->
            <div class="calculator-header">
                <h1 class="app-title">Kalkulator</h1>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle tema">
                    <span class="theme-icon" id="themeIcon">🌙</span>
                </button>
            </div>
            
            <!-- Area tampilan -->
            <div class="display-container">
                <div class="history-display" id="historyDisplay"></div>
                <div class="expression-display" id="expressionDisplay"></div>
                <div class="result-display" id="resultDisplay">0</div>
            </div>
            
            <!-- Riwayat perhitungan -->
            <div class="history-container" id="historyContainer">
                <div class="history-header">
                    <span>Riwayat</span>
                    <button class="clear-history" id="clearHistory">Hapus</button>
                </div>
                <div class="history-list" id="historyList"></div>
            </div>
            
            <!-- Tombol kalkulator -->
            <div class="buttons-grid">
                <button class="btn btn-clear" data-action="clear">C</button>
                <button class="btn btn-operator" data-action="backspace">⌫</button>
                <button class="btn btn-operator" data-action="percent">%</button>
                <button class="btn btn-operator" data-action="divide">÷</button>
                
                <button class="btn btn-number" data-value="7">7</button>
                <button class="btn btn-number" data-value="8">8</button>
                <button class="btn btn-number" data-value="9">9</button>
                <button class="btn btn-operator" data-action="multiply">×</button>
                
                <button class="btn btn-number" data-value="4">4</button>
                <button class="btn btn-number" data-value="5">5</button>
                <button class="btn btn-number" data-value="6">6</button>
                <button class="btn btn-operator" data-action="subtract">−</button>
                
                <button class="btn btn-number" data-value="1">1</button>
                <button class="btn btn-number" data-value="2">2</button>
                <button class="btn btn-number" data-value="3">3</button>
                <button class="btn btn-operator" data-action="add">+</button>
                
                <button class="btn btn-operator" data-action="negate">±</button>
                <button class="btn btn-number" data-value="0">0</button>
                <button class="btn btn-number" data-value=".">.</button>
                <button class="btn btn-equals" data-action="equals">=</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
